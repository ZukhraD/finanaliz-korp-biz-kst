  --ok: var(--lime-ink); --ok-bg: var(--lime-soft); --chk: #8A5A00; --chk-bg: #FFF3D6; --risk: #B23A0C; --risk-bg: #FFE8DD;
  --crit: #A3122F; --crit-bg: #FCE3E8; --nd: #5E5E5E; --nd-bg: var(--plat-soft);
  --head: "Futura PT", "Jost", "Century Gothic", "Trebuchet MS", sans-serif;
  --sans: "Roboto", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --sys: Verdana, Geneva, "DejaVu Sans", sans-serif;
  --shape: 26px 26px 26px 0; --shape-s: 14px 14px 14px 0; --r: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--head); font-weight: 500; margin: 0; letter-spacing: 0; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.15; }
h2 { font-size: 20px; line-height: 1.3; }
h3 { font-size: 16px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-family: var(--sys); font-size: 11.5px; }
.hidden { display: none !important; }

/* кнопки */
.btn { border: 1.5px solid var(--platinum); background: var(--white); padding: 9px 16px; border-radius: var(--shape-s); cursor: pointer; white-space: nowrap; font-weight: 500; color: var(--graphite); }
.btn:hover { border-color: var(--azure); color: var(--azure); }
.btn.primary { background: var(--azure); border-color: var(--azure); color: #fff; }
.btn.primary:hover { background: var(--azure-ink); border-color: var(--azure-ink); color: #fff; }
.btn.ghost { background: none; border-color: transparent; color: var(--azure); padding-left: 6px; padding-right: 6px; }
.btn.danger { color: var(--crit); }
.btn.big { padding: 13px 22px; font-size: 15.5px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* главная */
.home { max-width: 1080px; margin: 0 auto; padding: 40px 20px 60px; }
.hero { background: var(--azure); color: #fff; border-radius: 44px 44px 44px 0; padding: 38px 40px 34px; margin-bottom: 22px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: 40px; top: 40px; width: 150px; height: 150px; border-radius: 52px 52px 52px 0; background: var(--lime); }
.hero::before { content: ""; position: absolute; right: 120px; top: 120px; width: 110px; height: 110px; border-radius: 40px 40px 40px 0; background: var(--white); opacity: .14; z-index: 1; }
.hero > * { position: relative; z-index: 1; }
.hero h1 { color: #fff; font-size: 40px; max-width: calc(100% - 200px); }
.hero p { max-width: min(64ch, calc(100% - 200px)); margin-top: 12px; color: #DCE4FF; font-size: 15.5px; }
.hero .row { margin-top: 22px; }
.hero .btn { border-color: transparent; }
.hero .btn.primary { background: #fff; color: var(--azure); }
.hero .btn.primary:hover { background: var(--azure-soft); }
.hero .btn.alt { background: var(--lime); color: var(--graphite); }
.hero .btn.alt:hover { background: #00A800; color: var(--graphite); }
.hero .btn.alt2 { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.55); }
.hero .btn.alt2:hover { border-color: #fff; color: #fff; }
.how { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 0 30px; }
.how div { background: var(--plat-soft); border-radius: var(--shape-s); padding: 14px; }
.how b { display: block; font-family: var(--head); font-weight: 500; font-size: 15.5px; color: var(--graphite); margin-bottom: 4px; }
.how b em { font-style: normal; color: var(--azure); margin-right: 4px; }
.how span { font-family: var(--sys); font-size: 11.5px; color: var(--muted); }
.clist { display: grid; gap: 8px; }
.citem { background: var(--white); border: 1.5px solid var(--platinum); border-radius: var(--shape-s); padding: 13px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; }
.citem:hover { border-color: var(--azure); }
.citem .nm { flex: 1; min-width: 0; }
.citem .nm b { display: block; font-weight: 500; }
.empty { background: var(--plat-soft); border-radius: var(--shape-s); padding: 24px; text-align: center; color: var(--muted); }

/* клиент */
.app { display: grid; grid-template-columns: 296px 1fr; min-height: 100vh; }
.rail { background: var(--white); color: var(--graphite); border-right: 1.5px solid var(--platinum); padding: 22px 14px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { font-family: var(--head); font-weight: 500; font-size: 19px; color: var(--graphite); line-height: 1.2; padding: 0 8px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.brand::before { content: ""; width: 28px; height: 28px; flex: 0 0 28px; border-radius: 10px 10px 10px 0; background: var(--azure); box-shadow: 9px -9px 0 -3px var(--lime); }
.brand small { display: block; font-family: var(--sys); font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.rail .client { padding: 12px 10px; background: var(--plat-soft); border-radius: var(--shape-s); }
.rail .client b { color: var(--graphite); display: block; font-weight: 500; word-break: break-word; }
.rail .client button { background: none; border: 0; color: var(--azure); padding: 0; cursor: pointer; font-family: var(--sys); font-size: 11.5px; margin-top: 4px; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { margin: 3px 0; }
.steps button { width: 100%; text-align: left; background: none; border: 0; color: var(--graphite); padding: 10px 26px 10px 42px; border-radius: var(--shape-s); cursor: pointer; position: relative; }
.steps button::before { counter-increment: s; content: counter(s); position: absolute; left: 10px; top: 10px; width: 22px; height: 22px; border-radius: 8px 8px 8px 0; background: var(--plat-soft); font-family: var(--head); font-size: 13px; display: grid; place-items: center; color: var(--graphite); }
.steps button:hover { background: var(--azure-soft); }
.steps button[aria-current="page"] { background: var(--azure); color: #fff; font-weight: 500; }
.steps button[aria-current="page"]::before { background: #fff; color: var(--azure); }
.steps .dot { position: absolute; right: 11px; top: 18px; width: 8px; height: 8px; border-radius: 50%; }
.dot.ok { background: var(--lime); } .dot.chk { background: #F2B01E; } .dot.risk, .dot.crit { background: #E5482D; } .dot.nd { background: #B9B8B5; }
.steps button[aria-current="page"] .dot { box-shadow: 0 0 0 2px #fff; }
.rail .foot { margin-top: auto; font-family: var(--sys); font-size: 11px; color: var(--muted); padding: 0 8px; }
.rail .foot .btn { color: var(--azure); }
.main { min-width: 0; padding: 30px 36px 70px; }
.pagehead { margin-bottom: 20px; display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.pagehead .lead { flex: 1 1 420px; }
.pagehead p { color: var(--muted); max-width: 76ch; margin-top: 8px; }

/* панели и формы */
.panel { background: var(--white); border: 1.5px solid var(--platinum); border-radius: var(--shape); padding: 22px 24px; margin-bottom: 16px; }
.panel > h2, .panel > h3 { margin-bottom: 4px; }
.panel .hint { font-family: var(--sys); color: var(--muted); font-size: 11.5px; margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 16px; }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld > span { font-family: var(--sys); font-size: 11.5px; color: var(--muted); }
.fld > span i { font-style: normal; color: #9A9A9A; }
.inp, select.inp, textarea.inp { border: 1.5px solid transparent; background: var(--in-bg); color: var(--in-ink); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.inp:hover { border-color: var(--platinum); }
.inp:focus { background: #fff; border-color: var(--azure); outline: none; }
.inp::placeholder { color: #A5A5A5; }
.inp.num { text-align: right; }
textarea.inp { min-height: 76px; resize: vertical; line-height: 1.5; }
.fld.wide { grid-column: 1 / -1; }
.calcbox { background: var(--lime-soft); color: var(--lime-ink); border-radius: 8px 8px 8px 0; padding: 8px 10px; font-weight: 700; }

/* таблицы */
.tw { overflow-x: auto; }
table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
table.t th, table.t td { padding: 7px 10px; border-bottom: 1px solid var(--rule-soft); text-align: right; vertical-align: middle; }
table.t thead th { background: var(--platinum); font-weight: 500; color: var(--graphite); border-bottom: 0; font-family: var(--sys); font-size: 11px; }
table.t thead th:first-child { border-radius: 10px 0 0 0; }
table.t thead th:last-child { border-radius: 0 10px 0 0; }
table.t .l { text-align: left; }
table.t tr.sec td { background: var(--azure-soft); color: var(--azure-ink); font-weight: 500; text-align: left; font-size: 13px; font-family: var(--head); }
table.t tr.tot td { background: var(--plat-soft); font-weight: 700; }
table.t td.c { padding: 2px 3px; }
table.t td.c .inp { border-radius: 6px; min-width: 100px; text-align: right; padding: 6px 9px; }
table.t td.c select.inp, table.t td.c .inp.txt { text-align: left; }
table.t td.c select.inp { min-width: 130px; }
table.t td .note { display: block; font-family: var(--sys); font-size: 10.5px; color: var(--muted); }
table.t .neg { color: var(--crit); }
table.t td.x { width: 34px; padding: 0 4px; }
.xbtn { border: 0; background: none; color: #A0A0A0; cursor: pointer; font-size: 17px; line-height: 1; padding: 6px; }
.xbtn:hover { color: var(--crit); }
input[type="checkbox"] { accent-color: var(--azure); width: 16px; height: 16px; }

/* загрузка */
.drop { border: 2px dashed var(--azure-line); border-radius: var(--shape); padding: 26px; text-align: center; background: var(--azure-soft); color: var(--graphite); }
.drop.on { background: #DDE6FF; border-color: var(--azure); }
.drop b { display: block; font-family: var(--head); font-weight: 500; font-size: 17px; margin-bottom: 6px; color: var(--azure); }
.drop .small { margin-top: 8px; }
.flist { margin-top: 12px; display: grid; gap: 6px; }
.fitem { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; padding: 9px 12px; border-radius: 10px 10px 10px 0; background: var(--plat-soft); }
.fitem .ic { width: 22px; height: 22px; border-radius: 7px 7px 7px 0; display: grid; place-items: center; flex: 0 0 22px; font-size: 12px; font-weight: 700; }
.fitem.ok .ic { background: var(--lime); color: #fff; } .fitem.err .ic { background: var(--crit); color: #fff; }
.fitem .fn { flex: 1; min-width: 0; } .fitem .fn b { word-break: break-all; font-weight: 500; }

/* статусы */
.tag { display: inline-block; font-family: var(--sys); font-size: 10.5px; padding: 3px 9px; border-radius: 8px 8px 8px 0; font-weight: 700; white-space: nowrap; }
.tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.chk { background: var(--chk-bg); color: var(--chk); }
.tag.risk { background: var(--risk-bg); color: var(--risk); } .tag.crit { background: var(--crit-bg); color: var(--crit); } .tag.nd { background: var(--nd-bg); color: var(--nd); }

/* анализ */
.verdict { border-radius: var(--shape); padding: 20px 24px; margin-bottom: 16px; display: flex; gap: 16px; align-items: flex-start; }
.verdict .big { font-family: var(--head); font-size: 23px; font-weight: 500; }
.verdict p { margin: 6px 0 0; }
.verdict.ok { background: var(--lime); color: var(--graphite); }
.verdict.chk { background: #FFE9A8; color: var(--graphite); }
.verdict.risk { background: #FFD0BA; color: var(--graphite); }
.verdict.crit { background: var(--crit); color: #fff; }
.verdict.nd { background: var(--platinum); color: var(--graphite); }
.vicon { width: 44px; height: 44px; border-radius: 14px 14px 14px 0; display: grid; place-items: center; font-size: 21px; font-weight: 700; background: rgba(255,255,255,.75); color: var(--graphite); flex: 0 0 44px; }
.verdict.crit .vicon { color: var(--crit); background: #fff; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--white); border: 1.5px solid var(--platinum); border-radius: var(--shape); padding: 16px 18px; position: relative; }
.kpi::before { content: ""; position: absolute; left: 18px; top: 0; width: 42px; height: 4px; border-radius: 0 0 4px 4px; background: #B9B8B5; }
.kpi.ok::before { background: var(--lime); } .kpi.chk::before { background: #F2B01E; } .kpi.risk::before { background: #E5482D; } .kpi.crit::before { background: var(--crit); }
.kpi .k { font-family: var(--sys); font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 4px; }
.kpi .v { font-family: var(--head); font-size: 30px; font-weight: 500; margin: 6px 0 4px; color: var(--graphite); }
.kpi .v small { font-family: var(--sans); font-size: 13px; font-weight: 400; color: var(--muted); }
.kpi .e { font-size: 13.5px; color: #3E3E3E; }
.kpi .n { font-family: var(--sys); font-size: 11px; color: var(--muted); margin-top: 8px; border-top: 1px solid var(--rule-soft); padding-top: 8px; }
.maxsum { display: flex; gap: 12px; flex-wrap: wrap; }
.maxsum > div { flex: 1 1 200px; background: var(--plat-soft); border-radius: var(--shape-s); padding: 14px 16px; }
.maxsum > div:last-child { background: var(--azure); color: #fff; }
.maxsum > div:last-child .muted, .maxsum > div:last-child .small { color: #DCE4FF; }
.maxsum .v { font-family: var(--head); font-size: 26px; font-weight: 500; color: var(--azure); margin: 2px 0; }
.maxsum > div:last-child .v { color: #fff; }

/* проблемы */
.prob { background: var(--white); border: 1.5px solid var(--platinum); border-radius: var(--shape-s); padding: 14px 18px 14px 22px; margin-bottom: 10px; position: relative; }
.prob::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 5px; border-radius: 0 5px 5px 0; background: #B9B8B5; }
.prob.crit::before { background: var(--crit); } .prob.risk::before { background: #E5482D; } .prob.chk::before { background: #F2B01E; } .prob.ok::before { background: var(--lime); }
.prob .hd { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.prob .hd b { font-size: 15px; font-weight: 500; }
.prob .area { font-family: var(--sys); font-size: 11px; color: var(--muted); margin-left: auto; }
.prob .why { margin: 6px 0 0; }
.prob .todo { margin-top: 8px; font-size: 13.5px; color: var(--azure-ink); background: var(--azure-soft); padding: 7px 11px; border-radius: 8px 8px 8px 0; }
.prob .todo::before { content: "Что сделать: "; font-weight: 700; }
.cnt { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.cnt .tag { font-size: 11.5px; padding: 5px 11px; }
.main h2[style] { font-family: var(--head); }

/* заключение */
.concl { font-family: var(--sans); font-size: 14.5px; width: 100%; min-height: 560px; border: 1.5px solid var(--platinum); border-radius: var(--shape); padding: 20px 22px; line-height: 1.65; background: #fff; color: var(--ink); resize: vertical; }
.concl:focus { outline: none; border-color: var(--azure); }
.edited { font-family: var(--sys); font-size: 11.5px; color: var(--chk); }

/* подсказки */
.tip { position: relative; display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 6px 6px 6px 0; background: var(--azure-soft); color: var(--azure); font-family: var(--sys); font-size: 10px; font-weight: 700; cursor: help; }

/* тост и диалог */
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--graphite); color: #fff; padding: 11px 18px; border-radius: 12px 12px 12px 0; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: 90vw; }
#toast.on { opacity: 1; transform: translateX(-50%); }
.modal { position: fixed; inset: 0; background: rgba(39,39,39,.45); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal .box { background: #fff; border-radius: var(--shape); padding: 22px 24px; max-width: 520px; width: 100%; }
.modal .box h3 { margin-bottom: 8px; font-size: 19px; }
.modal .row { margin-top: 16px; justify-content: flex-end; }

@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

@media print {
  body { background: #fff; font-size: 12px; }
  .rail, .noprint, .btn, #toast { display: none !important; }
  .app { display: block; }
  .main { padding: 0; }
  .panel, .kpi, .prob { break-inside: avoid; }
  .verdict { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .concl { display: none; }
  .printonly { display: block !important; white-space: pre-wrap; font-size: 12.5px; line-height: 1.55; }
}
.printonly { display: none; }

/* левая панель: подвал */
.rail .foot { display: flex; flex-direction: column; gap: 12px; }
.rail .foot .copy { border-top: 1.5px solid var(--platinum); padding-top: 12px; color: var(--graphite); }

/* заключение — готовый документ */
.doc { background: var(--white); border: 1.5px solid var(--platinum); border-radius: var(--shape); padding: 32px 40px; width: 100%; line-height: 1.6; }
.doc .dt { font-size: 26px; margin-bottom: 4px; }
.doc .dmeta { font-family: var(--sys); font-size: 11.5px; color: var(--muted); }
.doc .dmeta:last-child { margin-top: 22px; padding-top: 12px; border-top: 1px solid var(--rule-soft); }
.doc h3 { font-size: 17px; margin: 22px 0 8px; color: var(--azure); }
.doc p { margin: 0 0 8px; }
.doc ul { margin: 4px 0 10px; padding-left: 20px; }
.doc li { margin: 6px 0; }
.doc li .tag { vertical-align: 1px; }
.dverdict { margin: 18px 0 6px; padding: 16px 20px; border-radius: var(--shape-s); background: var(--platinum); }
.dverdict span { display: block; font-family: var(--sys); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .75; }
.dverdict b { display: block; font-family: var(--head); font-weight: 500; font-size: 21px; margin: 2px 0 4px; }
.dverdict p { margin: 0; }
.dverdict.ok { background: var(--lime); color: var(--graphite); } .dverdict.chk { background: #FFE9A8; } .dverdict.risk { background: #FFD0BA; }
.dverdict.crit { background: var(--crit); color: #fff; }
@media print { .doc { border: 0; padding: 0; max-width: none; } .dverdict, .tag { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }

/* ровная сетка карточки: 3 одинаковые колонки, подписи в одну строку, поля одной высоты */
.grid.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 20px; align-items: start; }
.grid.g3 .fld > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 17px; line-height: 17px; }
.grid.g3 .inp, .grid.g3 .calcbox { height: 40px; }
.calcbox { display: flex; align-items: center; }
.fnote { font-family: var(--sys); font-size: 10.5px; color: var(--muted); margin-top: 2px; }

/* овердрафт */
table.odt td.c .inp { min-width: 140px; }
.odres { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.odres > div { background: var(--plat-soft); border-radius: var(--shape-s); padding: 14px 16px; }
.odres > div:first-child { background: var(--azure); color: #fff; }
.odres span { display: block; font-family: var(--sys); font-size: 11px; opacity: .8; }
.odres b { display: block; font-family: var(--head); font-weight: 500; font-size: 24px; margin: 2px 0; }
.odres i { font-style: normal; font-family: var(--sys); font-size: 11px; opacity: .85; }
.odchk { display: grid; gap: 6px; }
.odchk > div { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; background: var(--plat-soft); border-radius: 10px 10px 10px 0; }
.odchk b { font-weight: 500; font-size: 14px; }
.odchk em { font-style: normal; font-family: var(--sys); font-size: 11px; color: var(--muted); text-align: right; }
.odchk .tag { justify-self: start; }

/* подвал главной */
.homefoot { margin-top: 28px; padding-top: 14px; border-top: 1.5px solid var(--platinum); font-family: var(--sys); font-size: 11.5px; color: var(--graphite); }

/* овердрафт: выписки */
table.t td.auto { background: var(--lime-soft); color: var(--lime-ink); font-weight: 500; }
table.odex tr.zero td { color: #A5A5A5; }
details.ops { margin-top: 16px; }
details.ops summary { cursor: pointer; color: var(--azure); font-weight: 500; }
table.ops td.purp { max-width: 420px; white-space: normal; font-size: 12.5px; }
table.ops td { vertical-align: top; }
table.ops td.c select.inp { min-width: 210px; }
table.ops tr.man td { background: var(--azure-soft); }

/* ================================================================ устройства (атрибут data-device ставит скрипт) */
.tabbar, .mfoot { display: none; }
.homefoot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.homefoot .dev { color: var(--muted); }
.tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

овердрафт, Бизнес Успех, Start up).","для всех клиентов":"барлық клиент үшін","Условия финансирования":"Қаржыландыру шарттары","ВКЛ — возобновляемая кредитная линия: в долговой нагрузке только проценты за год. НКЛ — невозобновляемая: весь платёж за год. Данные те же, что в прогнозе («Запрашиваемый кредит»).":"ВКЛ — жаңартылатын несие желісі: борыштық жүктемеде жылдық сыйақы ғана ескеріледі. НКЛ — жаңартылмайтын: жылдық төлемнің барлығы ескеріледі. Деректер болжамдағыдай («Сұралатын несие»).","Тип финансирования":"Қаржыландыру түрі","Характер цели (для лимитов срока)":"Мақсат сипаты (мерзім шектеулері үшін)","Инвестиционная":"Инвестициялық","Укажите сумму, срок и ставку — рассчитаю ежемесячный платёж.":"Сома, мерзім және мөлшерлемені көрсетіңіз — айлық төлемді есептеймін.","Ежемесячный платёж, тыс. тг":"Айлық төлем, мың теңге","Ежемесячный платёж":"Айлық төлем","ежемесячный платёж":"айлық төлем","Проценты за год (долговая нагрузка)":"Жылдық сыйақы (борыштық жүктеме)","Платёж за год (долговая нагрузка)":"Жылдық төлем (борыштық жүктеме)","Проценты за год, тыс. тг":"Жылдық сыйақы, мың теңге","Платёж за год, тыс. тг":"Жылдық төлем, мың теңге","ВКЛ: в долговой нагрузке учитываются только проценты за год — основной долг возобновляется.":"ВКЛ: борыштық жүктемеде жылдық сыйақы ғана ескеріледі — негізгі борыш жаңартылады.","НКЛ: в долговой нагрузке учитывается весь платёж за год — основной долг и проценты.":"НКЛ: борыштық жүктемеде жылдық төлемнің барлығы — негізгі борыш пен сыйақы ескеріледі.","Льготный период по основному долгу —":"Негізгі борыш бойынша жеңілдікті кезең —","мес.: платёж показан после его окончания.":"ай: төлем ол аяқталғаннан кейін көрсетілген.","При дифференцированной схеме показан первый платёж, далее он уменьшается.":"Сараланған сызбада бірінші төлем көрсетілген, одан әрі ол азаяды.","Тип финансирования —":"Қаржыландыру түрі —","срок":"мерзімі","ставка":"мөлшерлемесі","проценты":"сыйақы","за год (долговая нагрузка) —":"жылына (борыштық жүктеме) —","Условия:":"Шарттар:","Условия продукта":"Өнім шарттары","Продукт работает по принципу овердрафта (кредитная линия). Лимиты:":"Өнім овердрафт қағидатымен жұмыс істейді (несие желісі). Шектеулер:","срок финансирования до":"қаржыландыру мерзімі","мес., период доступности до":"айға дейін, қолжетімділік кезеңі","мес., сумма":"айға дейін, сома"," до 75 млн тг и до 70 % оценочной стоимости недвижимости (LTV)":" 75 млн теңгеге дейін және жылжымайтын мүліктің бағалау құнының 70 %-ына дейін (LTV)"," — по решению; при сумме свыше 100 млн тг нужна гарантия платёжеспособного юрлица":" — шешім бойынша; сома 100 млн теңгеден асса, төлем қабілетті заңды тұлғаның кепілдігі қажет","Период доступности, мес.":"Қолжетімділік кезеңі, ай","Отчёт НОК — партнёр Банка":"ТБК есебі — Банк әріптесі","Стоимость инвестиционного проекта, тыс. тг":"Инвестициялық жобаның құны, мың теңге","Не известно":"Белгісіз","Укажите «СК Банка» в блоке «Клиент и запрос»: для проектов до 0,02 % от СК Банка заключения ЗС и ЮУ не требуются, оценка залога — силами КП.":"«Клиент және сұрау» блогында «Банктің МК» көрсетіңіз: Банк МК-нің 0,02 %-ына дейінгі жобалар үшін ҚҚ және ЗБ қорытындылары талап етілмейді, кепілді бағалауды КМ жүргізеді.","Сумма":"Сома","тыс. тг ≤ 0,02 % СК Банка":"мың теңге ≤ Банк МК-нің 0,02 %-ы","заключения ЗС и ЮУ не требуются, рыночную стоимость залога проверяет КП по ВНД Банка.":"ҚҚ және ЗБ қорытындылары талап етілмейді, кепілдің нарықтық құнын КМ Банктің ІНҚ бойынша тексереді.","тыс. тг > 0,02 % СК Банка":"мың теңге > Банк МК-нің 0,02 %-ы","заключения ЗС и ЮУ обязательны.":"ҚҚ және ЗБ қорытындылары міндетті.","Основные условия продукта":"Өнімнің негізгі шарттары","Сумма: не более 75 млн тг и не более 70 % оценочной стоимости недвижимости в залоге. При LTV свыше 0,5 до 0,7 — также не более 100 % валюты баланса и 100 % годовой выручки. LTV округляется до десятых.":"Сома: 75 млн теңгеден аспайды және кепілдегі жылжымайтын мүліктің бағалау құнының 70 %-ынан аспайды. LTV 0,5-тен 0,7-ге дейін болса — сондай-ақ баланс валютасының 100 %-ынан және жылдық түсімнің 100 %-ынан аспайды. LTV ондыққа дейін дөңгелектенеді.","Цель: ПОС, инвестиции, рефинансирование. Срок: ПОС — до 37 мес., инвестиции — до 60 мес.; период доступности: ПОС — до 6 мес., инвестиции — до 12 мес.":"Мақсат: АҚТ, инвестициялар, қайта қаржыландыру. Мерзімі: АҚТ — 37 айға дейін, инвестициялар — 60 айға дейін; қолжетімділік кезеңі: АҚТ — 6 айға дейін, инвестициялар — 12 айға дейін.","Залог: жилая недвижимость или коммерческие помещения вне жилого фонда в черте городов присутствия. Не принимаются земельные участки, объекты без коммуникаций и отделки, подвалы.":"Кепіл: тұрғын үй немесе тұрғын үй қорынан шығарылған коммерциялық үй-жайлар, қатысу қалаларының шегінде. Жер учаскелері, коммуникациясыз және әрлеусіз объектілер, жертөлелер қабылданбайды.","Гарантии учредителей, руководителей, бенефициаров (ЮЛ); супруга/супруги (ИП).":"Құрылтайшылардың, басшылардың, бенефициарлардың (ЗТ) кепілдіктері; жұбайының (ЖК).","Погашение: ежемесячно, аннуитет или равные доли, без отсрочки и льготного периода; вознаграждение ежемесячно.":"Өтеу: ай сайын, аннуитет немесе тең үлестер, кейінге қалдырусыз және жеңілдікті кезеңсіз; сыйақы ай сайын.","Заёмщик: опыт от 6 мес. (LTV до 0,5) или от 12 мес. (LTV свыше 0,5 до 0,7); положительная кредитная история и благонадёжность; не красная и не чёрная зона; положительные капитал и чистая прибыль; нет триггеров обесценения.":"Қарыз алушы: тәжірибесі 6 айдан (LTV 0,5-ке дейін) немесе 12 айдан (LTV 0,5-тен 0,7-ге дейін); оң несие тарихы және сенімділік; қызыл және қара аймақта емес; капитал мен таза пайда оң; құнсыздану триггерлері жоқ.","Проект: отчёт НОК — партнёра Банка; выдача после регистрации залога; выезд на место ведения бизнеса и осмотр залога; запрет на цели оплаты аффилированным лицам.":"Жоба: ТБК есебі — Банк әріптесі; кепіл тіркелгеннен кейін беру; бизнес жүргізу орнына шығу және кепілді қарау; аффилирленген тұлғаларға төлеу мақсатына тыйым.","Цель: ПОС (срок до 36 мес.) или инвестиции (до 60 мес.); тип — ВКЛ или НКЛ; период доступности — до 12 мес.; отсрочка по основному долгу — до 12 мес.; в последние 6 мес. не более 15 % суммы основного долга.":"Мақсат: АҚТ (мерзімі 36 айға дейін) немесе инвестициялар (60 айға дейін); түрі — ВКЛ немесе НКЛ; қолжетімділік кезеңі — 12 айға дейін; негізгі борыш бойынша кейінге қалдыру — 12 айға дейін; соңғы 6 айда негізгі борыш сомасының 15 %-ынан аспайды.","Залог: покрытие не менее 100 %: гарантия АО «ФРП «Даму» — 60–85 % (срок не меньше срока финансирования), остальное — деньги и/или недвижимость (не земля, не объекты без коммуникаций и отделки, не подвалы).":"Кепіл: жабу кемінде 100 %: «ҚДҚ «Даму» АҚ кепілдігі — 60–85 % (мерзімі қаржыландыру мерзімінен кем емес), қалғаны — ақша және/немесе жылжымайтын мүлік (жер емес, коммуникациясыз және әрлеусіз объектілер емес, жертөлелер емес).","Гарантии: ИП — супруг(а), залогодатель; ЮЛ — учредители, участники, акционеры, бенефициары. При сумме свыше 100 млн тг — ещё гарантия платёжеспособного юрлица (Debt/EBITDA ≤ 3, DSCR ≥ 1,3, опыт от 12 мес.).":"Кепілдіктер: ЖК — жұбайы, кепіл беруші; ЗТ — құрылтайшылар, қатысушылар, акционерлер, бенефициарлар. Сома 100 млн теңгеден асса — төлем қабілетті заңды тұлғаның кепілдігі де (Debt/EBITDA ≤ 3, DSCR ≥ 1,3, тәжірибесі 12 айдан).","Собственное участие — не менее 20 % стоимости инвестпроекта (деньги в залоге — не менее 15 %).":"Өз қатысуы — инвестжоба құнының кемінде 20 %-ы (кепілдегі ақша — кемінде 15 %).","Заёмщик: положительная кредитная история (её отсутствие — не стоп-фактор), благонадёжность, не красная и не чёрная зона, приоритетные отрасли госпрограммы.":"Қарыз алушы: оң несие тарихы (оның болмауы — стоп-фактор емес), сенімділік, қызыл және қара аймақта емес, мемлекеттік бағдарламаның басым салалары.","Бизнес-план: инвестфаза до 12 мес., ввод в эксплуатацию до 3 мес. после неё, окупаемость = срок финансирования − 6 мес., чистая прибыль / взнос по кредиту не более 1,2.":"Бизнес-жоспар: инвестфаза 12 айға дейін, одан кейін пайдалануға беру 3 айға дейін, өтелімділік = қаржыландыру мерзімі − 6 ай, таза пайда / несие бойынша жарна 1,2-ден аспайды.","Не финансируются: строительство и покупка недвижимости для сдачи в аренду; такси при сроке более 3 лет.":"Қаржыландырылмайды: жалға беру үшін жылжымайтын мүлік салу және сатып алу; мерзімі 3 жылдан асатын такси.","Требования продукта «":"Өнім талаптары «","Срок финансирования не более":"Қаржыландыру мерзімі көп дегенде","ПОС":"АҚТ","инвестиционные цели":"инвестициялық мақсаттар","по выбранному характеру цели":"таңдалған мақсат сипаты бойынша","Уменьшите срок до":"Мерзімді қысқартыңыз:","Период доступности не более":"Қолжетімділік кезеңі көп дегенде","Укажите период доступности в блоке «Условия продукта».":"«Өнім шарттары» блогында қолжетімділік кезеңін көрсетіңіз.","Погашение основного долга ежемесячно, без отсрочки и льготного периода":"Негізгі борышты ай сайын, кейінге қалдырусыз және жеңілдікті кезеңсіз өтеу","льготный период":"жеңілдікті кезең","Уберите льготный период по основному долгу.":"Негізгі борыш бойынша жеңілдікті кезеңді алып тастаңыз.","Сумма финансирования не более 75 млн тг":"Қаржыландыру сомасы 75 млн теңгеден аспайды","сумма не указана":"сома көрсетілмеген","Уменьшите сумму до 75 000 тыс. тг.":"Соманы 75 000 мың теңгеге дейін азайтыңыз.","Залог — недвижимость (жилая или коммерческая вне жилого фонда; не земля, не подвал, не объект без коммуникаций)":"Кепіл — жылжымайтын мүлік (тұрғын немесе тұрғын үй қорынан тыс коммерциялық; жер емес, жертөле емес, коммуникациясыз объект емес)","рыночная стоимость недвижимости":"жылжымайтын мүліктің нарықтық құны","недвижимость в залоге не указана":"кепілдегі жылжымайтын мүлік көрсетілмеген","Добавьте недвижимость на странице «Кредитная история» (раздел залога) и проверьте вид объекта.":"«Несие тарихы» бетіне (кепіл бөлімі) жылжымайтын мүлікті қосыңыз және объект түрін тексеріңіз.","Сумма не более 70 % оценочной стоимости недвижимости (LTV до 0,7 с округлением до десятых)":"Сома жылжымайтын мүліктің бағалау құнының 70 %-ынан аспайды (LTV 0,7-ге дейін, ондыққа дейін дөңгелектеумен)","округлённо":"дөңгелектегенде","Уменьшите сумму или увеличьте оценочную стоимость залога. При совокупном залоге учитывайте все обязательства под него.":"Соманы азайтыңыз немесе кепілдің бағалау құнын арттырыңыз. Жиынтық кепіл кезінде оған қатысты барлық міндеттемені ескеріңіз.","При LTV свыше 0,5: сумма не более 100 % валюты баланса":"LTV 0,5-тен жоғары болса: сома баланс валютасының 100 %-ынан аспайды","валюта баланса":"баланс валютасы","Сумма превышает валюту баланса на последнюю дату.":"Сома соңғы күндегі баланс валютасынан асады.","При LTV свыше 0,5: сумма не более 100 % годовой выручки":"LTV 0,5-тен жоғары болса: сома жылдық түсімнің 100 %-ынан аспайды","годовая выручка":"жылдық түсім","Сумма превышает годовую выручку.":"Сома жылдық түсімнен асады.","Срок ведения деятельности не менее":"Қызмет жүргізу мерзімі кемінде","дата регистрации неизвестна — «Подтянуть по БИН» или страница «Благонадёжность»":"тіркеу күні белгісіз — «БСН бойынша жүктеу» немесе «Сенімділік» беті","Укажите дату регистрации.":"Тіркеу күнін көрсетіңіз.","Отчёт НОК — партнёра Банка (иначе финансирование невозможно)":"ТБК есебі — Банк әріптесі (әйтпесе қаржыландыру мүмкін емес)","партнёр Банка":"Банк әріптесі","не партнёр":"әріптес емес","Выберите в блоке «Условия продукта».":"«Өнім шарттары» блогында таңдаңыз.","Отсрочка по основному долгу не более 12 мес.":"Негізгі борыш бойынша кейінге қалдыру 12 айдан аспайды","Уменьшите льготный период до 12 мес.":"Жеңілдікті кезеңді 12 айға дейін қысқартыңыз.","Покрытие обязательств залогом не менее 100 %":"Міндеттемелерді кепілмен жабу кемінде 100 %","покрытие":"жабу","залог не указан":"кепіл көрсетілмеген","Добавьте обеспечение (гарантия Даму, деньги, недвижимость).":"Қамтамасыз етуді қосыңыз (Даму кепілдігі, ақша, жылжымайтын мүлік).","Гарантия АО «ФРП «Даму» — от 60 % до 85 % суммы":"«ҚДҚ «Даму» АҚ кепілдігі — соманың 60 %-ынан 85 %-ына дейін","гарантия не указана":"кепілдік көрсетілмеген","Гарантия Даму должна покрывать 60–85 % обязательств; срок гарантии — не меньше срока финансирования.":"Даму кепілдігі міндеттемелердің 60–85 %-ын жабуы тиіс; кепілдік мерзімі — қаржыландыру мерзімінен кем емес.","Собственное участие не менее 20 % стоимости инвестиционного проекта":"Өз қатысуы инвестициялық жоба құнының кемінде 20 %-ы","укажите стоимость проекта":"жоба құнын көрсетіңіз","Увеличьте собственное участие или уменьшите сумму.":"Өз қатысуын арттырыңыз немесе соманы азайтыңыз.","Бизнес-план: инвестфаза до 12 мес., ввод до 3 мес., окупаемость = срок − 6 мес., чистая прибыль / взнос ≤ 1,2":"Бизнес-жоспар: инвестфаза 12 айға дейін, іске қосу 3 айға дейін, өтелімділік = мерзім − 6 ай, таза пайда / жарна ≤ 1,2","проверьте по бизнес-плану и разрешительным документам":"бизнес-жоспар мен рұқсат құжаттары бойынша тексеріңіз","Подтвердите по бизнес-плану, проектно-сметной документации и разрешениям.":"Бизнес-жоспар, жобалау-сметалық құжаттама және рұқсаттар бойынша растаңыз.","При сумме свыше 100 млн тг — гарантия платёжеспособного юрлица (Debt/EBITDA ≤ 3, DSCR ≥ 1,3, опыт от 12 мес.)":"Сома 100 млн теңгеден асса — төлем қабілетті заңды тұлғаның кепілдігі (Debt/EBITDA ≤ 3, DSCR ≥ 1,3, тәжірибесі 12 айдан)","гарантия юрлица указана — проверьте её показатели":"заңды тұлғаның кепілдігі көрсетілген — оның көрсеткіштерін тексеріңіз","гарантия юрлица не указана":"заңды тұлғаның кепілдігі көрсетілмеген","Добавьте гарантию юридического лица.":"Заңды тұлғаның кепілдігін қосыңыз.","Положительный собственный капитал на последнюю отчётную дату":"Соңғы есепті күнге меншікті капитал оң","Капитал должен быть положительным.":"Капитал оң болуы тиіс.","Положительная чистая прибыль:":"Таза пайда оң:","Чистая прибыль должна быть положительной за последний год и текущую дату.":"Таза пайда соңғы жылға және ағымдағы күнге оң болуы тиіс.","Положительная кредитная история (её отсутствие — не стоп-фактор)":"Оң несие тарихы (оның болмауы — стоп-фактор емес)","Гарантии учредителей, участников, бенефициаров и руководителей на всю сумму обязательств":"Құрылтайшылардың, қатысушылардың, бенефициарлар мен басшылардың міндеттемелердің барлық сомасына кепілдіктері","без гарантии:":"кепілдіксіз:","гарантии у всех":"барлығында кепілдік бар","учредители не внесены":"құрылтайшылар енгізілмеген","проверьте состав участников":"қатысушылар құрамын тексеріңіз","Внесите учредителей на карточке и отметьте гарантии.":"Құрылтайшыларды картаға енгізіп, кепілдіктерді белгілеңіз.","Гарантия супруга/супруги (при наличии)":"Жұбайының кепілдігі (бар болса)"," и залогодателя-третьего лица":" және үшінші тұлға — кепіл берушінің","проверьте по анкете":"сауалнама бойынша тексеріңіз","Получите гарантию супруга/супруги на всю сумму обязательств.":"Міндеттемелердің барлық сомасына жұбайының кепілдігін алыңыз.","Учредители компаний-ТОО":"ЖШС компанияларының құрылтайшылары","Для каждого ТОО внесите всех учредителей, участников и бенефициаров: от одного до десятков человек. Отметьте, кто даёт гарантию. Сумма долей должна быть 100 %.":"Әр ЖШС үшін барлық құрылтайшыны, қатысушыны және бенефициарды енгізіңіз: біреуден ондаған адамға дейін. Кім кепілдік беретінін белгілеңіз. Үлестердің қосындысы 100 % болуы тиіс.","Добавить учредителя":"Құрылтайшы қосу","Сумма долей:":"Үлестер қосындысы:","Удалить учредителя":"Құрылтайшыны жою","Учредитель":"Құрылтайшы","Учредитель и руководитель":"Құрылтайшы және басшы","Бенефициарный собственник":"Бенефициарлық меншік иесі","сумма долей учредителей":"құрылтайшылар үлестерінің қосындысы","а не 100 %":"100 % емес","Проверьте доли учредителей по справке о зарегистрированных юридических лицах.":"Құрылтайшылардың үлестерін заңды тұлғаны тіркеу туралы анықтама бойынша тексеріңіз.","ИИН учредителя должен содержать 12 цифр":"Құрылтайшының ЖСН-і 12 саннан тұруы тиіс","Исправьте ИИН.":"ЖСН-ді түзетіңіз.","Доля, %":"Үлесі, %","ИИН":"ЖСН","Гарантия":"Кепілдік","Не соответствует условиям продукта":"Өнім шарттарына сәйкес к ния":"қаржыландыру шарттары","вКЛ — возобновляемая кредитная линия: в долговой нагрузке только проценты за год. НКЛ — невозобновляемая: весь платёж за год. Данные те же, что в прогнозе («Запрашиваемый кредит»).":"вКЛ — жаңартылатын несие желісі: борыштық жүктемеде жылдық сыйақы ғана ескеріледі. НКЛ — жаңартылмайтын: жылдық төлемнің барлығы ескеріледі. Деректер болжамдағыдай («Сұралатын несие»).","тип финансирования":"қаржыландыру түрі","характер цели (для лимитов срока)":"мақсат сипаты (мерзім шектеулері үшін)","инвестиционная":"инвестициялық","укажите сумму, срок и ставку — рассчитаю ежемесячный платёж.":"сома, мерзім және мөлшерлемені көрсетіңіз — айлық төлемді есептеймін.","ежемесячный платёж, тыс. тг":"айлық төлем, мың теңге","проценты за год (долговая нагрузка)":"жылдық сыйақы (борыштық жүктеме)","платёж за год (долговая нагрузка)":"жылдық төлем (борыштық жүктеме)","проценты за год, тыс. тг":"жылдық сыйақы, мың теңге","платёж за год, тыс. тг":"жылдық төлем, мың теңге","вКЛ: в долговой нагрузке учитываются только проценты за год — основной долг возобновляется.":"вКЛ: борыштық жүктемеде жылдық сыйақы ғана ескеріледі — негізгі борыш жаңартылады.","нКЛ: в долговой нагрузке учитывается весь платёж за год — основной долг и проценты.":"нКЛ: борыштық жүктемеде жылдық төлемнің барлығы — негізгі борыш пен сыйақы ескеріледі.","льготный период по основному долгу —":"негізгі борыш бойынша жеңілдікті кезең —","при дифференцированной схеме показан первый платёж, далее он уменьшается.":"сараланған сызбада бірінші төлем көрсетілген, одан әрі ол азаяды.","тип финансирования —":"қаржыландыру түрі —","условия:":"шарттар:","условия продукта":"өнім шарттары","продукт работает по принципу овердрафта (кредитная линия). Лимиты:":"өнім овердрафт қағидатымен жұмыс істейді (несие желісі). Шектеулер:","период доступности, мес.":"қолжетімділік кезеңі, ай","отчёт НОК — партнёр Банка":"тБК есебі — Банк әріптесі","стоимость инвестиционного проекта, тыс. тг":"инвестициялық жобаның құны, мың теңге","не известно":"белгісіз","укажите «СК Банка» в блоке «Клиент и запрос»: для проектов до 0,02 % от СК Банка заключения ЗС и ЮУ не требуются, оценка залога — силами КП.":"«Клиент және сұрау» блогында «Банктің МК» көрсетіңіз: Банк МК-нің 0,02 %-ына дейінгі жобалар үшін ҚҚ және ЗБ қорытындылары талап етілмейді, кепілді бағалауды КМ жүргізеді.","сумма":"сома","основные условия продукта":"өнімнің негізгі шарттары","сумма: не более 75 млн тг и не более 70 % оценочной стоимости недвижимости в залоге. При LTV свыше 0,5 до 0,7 — также не более 100 % валюты баланса и 100 % годовой выручки. LTV округляется до десятых.":"сома: 75 млн теңгеден аспайды және кепілдегі жылжымайтын мүліктің бағалау құнының 70 %-ынан аспайды. LTV 0,5-тен 0,7-ге дейін болса — сондай-ақ баланс валютасының 100 %-ынан және жылдық түсімнің 100 %-ынан аспайды. LTV ондыққа дейін дөңгелектенеді.","цель: ПОС, инвестиции, рефинансирование. Срок: ПОС — до 37 мес., инвестиции — до 60 мес.; период доступности: ПОС — до 6 мес., инвестиции — до 12 мес.":"мақсат: АҚТ, инвестициялар, қайта қаржыландыру. Мерзімі: АҚТ — 37 айға дейін, инвестициялар — 60 айға дейін; қолжетімділік кезеңі: АҚТ — 6 айға дейін, инвестициялар — 12 айға дейін.","залог: жилая недвижимость или коммерческие помещения вне жилого фонда в черте городов присутствия. Не принимаются земельные участки, объекты без коммуникаций и отделки, подвалы.":"кепіл: тұрғын үй немесе тұрғын үй қорынан шығарылған коммерциялық үй-жайлар, қатысу қалаларының шегінде. Жер учаскелері, коммуникациясыз және әрлеусіз объектілер, жертөлелер қабылданбайды.","гарантии учредителей, руководителей, бенефициаров (ЮЛ); супруга/супруги (ИП).":"құрылтайшылардың, басшылардың, бенефициарлардың (ЗТ) кепілдіктері; жұбайының (ЖК).","погашение: ежемесячно, аннуитет или равные доли, без отсрочки и льготного периода; вознаграждение ежемесячно.":"өтеу: ай сайын, аннуитет немесе тең үлестер, кейінге қалдырусыз және жеңілдікті кезеңсіз; сыйақы ай сайын.","заёмщик: опыт от 6 мес. (LTV до 0,5) или от 12 мес. (LTV свыше 0,5 до 0,7); положительная кредитная история и благонадёжность; не красная и не чёрная зона; положительные капитал и чистая прибыль; нет триггеров обесценения.":"қарыз алушы: тәжірибесі 6 айдан (LTV 0,5-ке дейін) немесе 12 айдан (LTV 0,5-тен 0,7-ге дейін); оң несие тарихы және сенімділік; қызыл және қара аймақта емес; капитал мен таза пайда оң; құнсыздану триггерлері жоқ.","проект: отчёт НОК — партнёра Банка; выдача после регистрации залога; выезд на место ведения бизнеса и осмотр залога; запрет на цели оплаты аффилированным лицам.":"жоба: ТБК есебі — Банк әріптесі; кепіл тіркелгеннен кейін беру; бизнес жүргізу орнына шығу және кепілді қарау; аффилирленген тұлғаларға төлеу мақсатына тыйым.","цель: ПОС (срок до 36 мес.) или инвестиции (до 60 мес.); тип — ВКЛ или НКЛ; период доступности — до 12 мес.; отсрочка по основному долгу — до 12 мес.; в последние 6 мес. не более 15 % суммы основного долга.":"мақсат: АҚТ (мерзімі 36 айға дейін) немесе инвестициялар (60 айға дейін); түрі — ВКЛ немесе НКЛ; қолжетімділік кезеңі — 12 айға дейін; негізгі борыш бойынша кейінге қалдыру — 12 айға дейін; соңғы 6 айда негізгі борыш сомасының 15 %-ынан аспайды.","залог: покрытие не менее 100 %: гарантия АО «ФРП «Даму» — 60–85 % (срок не меньше срока финансирования), остальное — деньги и/или недвижимость (не земля, не объекты без коммуникаций и отделки, не подвалы).":"кепіл: жабу кемінде 100 %: «ҚДҚ «Даму» АҚ кепілдігі — 60–85 % (мерзімі қаржыландыру мерзімінен кем емес), қалғаны — ақша және/немесе жылжымайтын мүлік (жер емес, коммуникациясыз және әрлеусіз объектілер емес, жертөлелер емес).","гарантии: ИП — супруг(а), залогодатель; ЮЛ — учредители, участники, акционеры, бенефициары. При сумме свыше 100 млн тг — ещё гарантия платёжеспособного юрлица (Debt/EBITDA ≤ 3, DSCR ≥ 1,3, опыт от 12 мес.).":"кепілдіктер: ЖК — жұбайы, кепіл беруші; ЗТ — құрылтайшылар, қатысушылар, акционерлер, бенефициарлар. Сома 100 млн теңгеден асса — төлем қабілетті заңды тұлғаның кепілдігі де (Debt/EBITDA ≤ 3, DSCR ≥ 1,3, тәжірибесі 12 айдан).","собственное участие — не менее 20 % стоимости инвестпроекта (деньги в залоге — не менее 15 %).":"өз қатысуы — инвестжоба құнының кемінде 20 %-ы (кепілдегі ақша — кемінде 15 %).","заёмщик: положительная кредитная история (её отсутствие — не стоп-фактор), благонадёжность, не красная и не чёрная зона, приоритетные отрасли госпрограммы.":"қарыз алушы: оң несие тарихы (оның болмауы — стоп-фактор емес), сенімділік, қызыл және қара аймақта емес, мемлекеттік бағдарламаның басым салалары.","бизнес-план: инвестфаза до 12 мес., ввод в эксплуатацию до 3 мес. после неё, окупаемость = срок финансирования − 6 мес., чистая прибыль / взнос по кредиту не более 1,2.":"бизнес-жоспар: инвестфаза 12 айға дейін, одан кейін пайдалануға беру 3 айға дейін, өтелімділік = қаржыландыру мерзімі − 6 ай, таза пайда / несие бойынша жарна 1,2-ден аспайды.","не финансируются: строительство и покупка недвижимости для сдачи в аренду; такси при сроке более 3 лет.":"қаржыландырылмайды: жалға беру үшін жылжымайтын мүлік салу және сатып алу; мерзімі 3 жылдан асатын такси.","требования продукта «":"өнім талаптары «","срок финансирования не более":"қаржыландыру мерзімі көп дегенде","уменьшите срок до":"мерзімді қысқартыңыз:","период доступности не более":"қолжетімділік кезеңі көп дегенде","укажите период доступности в блоке «Условия продукта».":"«Өнім шарттары» блогында қолжетімділік кезеңін көрсетіңіз.","погашение основного долга ежемесячно, без отсрочки и льготного периода":"негізгі борышты ай сайын, кейінге қалдырусыз және жеңілдікті кезеңсіз өтеу","уберите льготный период по основному долгу.":"негізгі борыш бойынша жеңілдікті кезеңді алып тастаңыз.","сумма финансирования не более 75 млн тг":"қаржыландыру сомасы 75 млн теңгеден аспайды","уменьшите сумму до 75 000 тыс. тг.":"соманы 75 000 мың теңгеге дейін азайтыңыз.","залог — недвижимость (жилая или коммерческая вне жилого фонда; не земля, не подвал, не объект без коммуникаций)":"кепіл — жылжымайтын мүлік (тұрғын немесе тұрғын үй қорынан тыс коммерциялық; жер емес, жертөле емес, коммуникациясыз объект емес)","добавьте недвижимость на странице «Кредитная история» (раздел залога) и проверьте вид объекта.":"«Несие тарихы» бетіне (кепіл бөлімі) жылжымайтын мүлікті қосыңыз және объект түрін тексеріңіз.","сумма не более 70 % оценочной стоимости недвижимости (LTV до 0,7 с округлением до десятых)":"сома жылжымайтын мүліктің бағалау құнының 70 %-ынан аспайды (LTV 0,7-ге дейін, ондыққа дейін дөңгелектеумен)","уменьшите сумму или увеличьте оценочную стоимость залога. При совокупном залоге учитывайте все обязательства под него.":"соманы азайтыңыз немесе кепілдің бағалау құнын арттырыңыз. Жиынтық кепіл кезінде оған қатысты барлық міндеттемені ескеріңіз.","при LTV свыше 0,5: сумма не более 100 % валюты баланса":"lTV 0,5-тен жоғары болса: сома баланс валютасының 100 %-ынан аспайды","сумма превышает валюту баланса на последнюю дату.":"сома соңғы күндегі баланс валютасынан асады.","при LTV свыше 0,5: сумма не более 100 % годовой выручки":"lTV 0,5-тен жоғары болса: сома жылдық түсімнің 100 %-ынан аспайды","сумма превышает годовую выручку.":"сома жылдық түсімнен асады.","срок ведения деятельности не менее":"қызмет жүргізу мерзімі кемінде","укажите дату регистрации.":"тіркеу күнін көрсетіңіз.","отчёт НОК — партнёра Банка (иначе финансирование невозможно)":"тБК есебі — Банк әріптесі (әйтпесе қаржыландыру мүмкін емес)","выберите в блоке «Условия продукта».":"«Өнім шарттары» блогында таңдаңыз.","отсрочка по основному долгу не более 12 мес.":"негізгі борыш бойынша кейінге қалдыру 12 айдан аспайды","уменьшите льготный период до 12 мес.":"жеңілдікті кезеңді 12 айға дейін қысқартыңыз.","покрытие обязательств залогом не менее 100 %":"міндеттемелерді кепілмен жабу кемінде 100 %","добавьте обеспечение (гарантия Даму, деньги, недвижимость).":"қамтамасыз етуді қосыңыз (Даму кепілдігі, ақша, жылжымайтын мүлік).","гарантия АО «ФРП «Даму» — от 60 % до 85 % суммы":"«ҚДҚ «Даму» АҚ кепілдігі — /* ================================================================ Экспресс-анализ: расчёты, проблемы, вердикт.
   Пороговые значения собраны здесь, чтобы их легко было поменять под методику банка. */
const NORM = {
  dscr_ok: 1.25, dscr_min: 1.0,            // покрытие платежей
  lev_ok: 3.5, lev_max: 5,                 // долг / EBITDA (с новым кредитом)
  liq_ok: 1.0, liq_min: 0.7,               // текущая ликвидность
  eq_ok: 0.2, eq_min: 0.1,                 // доля собственного капитала
  rev_drop_chk: -0.1, rev_drop_risk: -0.2, // падение выручки
  wc_term: 36,                             // макс. срок для пополнения оборотных средств, мес.
  wc_share: 0.5,                           // сумма кредита к годовой выручке — проверить, если больше
  diff_pct: 0.1, diff_abs: 1000,           // расхождение: больше 10 % и больше 1 000 тыс. тг
};
const SEVW = { crit: 4, risk: 3, chk: 2, nd: 1, ok: 0 };
const SEVT = { crit: "Стоп-фактор", risk: "Риск", chk: "Проверить", nd: "Нет данных", ok: "Норма" };

/* ---------------------------------------------------------------- платёж по новому кредиту */
// цель «пополнение оборотных средств» (не овердрафт) — платёжная нагрузка считается только по процентам
// тип финансирования: ВКЛ — в нагрузке только проценты за год, НКЛ — весь платёж за год (у старых клиентов — по цели)
const finType = (c = X.card) => (c.fintype === "ВКЛ" || c.fintype === "НКЛ" ? c.fintype : /оборотн/i.test(c.purpose || "") ? "ВКЛ" : "НКЛ");
const isWC = (c = X.card) => c.product !== "Овердрафт" && finType(c) === "ВКЛ";
const isBU = (c = X.card) => c.product === "Бизнес Успех", isSU = (c = X.card) => c.product === "Start up";
const purCls = (c = X.card) => (/инвест/i.test(c.purpose || "") ? "Инв" : "ПОС");   // рефинансирование и смешанное — по строгому сроку ПОС
function loanPay(c = X.card) {
  const A = N(c.amount), n = Math.max(1, N(c.term) - N(c.grace)), r = N(c.rate) / 100 / 12;
  if (!A || !N(c.term)) return null;
  if (c.product === "Овердрафт") return { pay: A * r, first: A * r, grace: 0, year: A * r * 12, note: "только проценты (овердрафт гасится оборотами)" };
  // пополнение оборотных средств: нагрузка — только проценты (сумма × ставка в год)
  if (isWC(c)) return { pay: A * r, first: A * r, grace: A * r, year: A * r * 12, wc: true, note: `только проценты: ${fmt(A * r * 12)} тыс. тг в год` };
  if (c.sched === "end") return { pay: A * r, first: A * r, grace: A * r, year: A * r * 12, balloon: A, note: "ежемесячно только проценты, долг — одной суммой в конце срока" };
  const gr = Math.min(12, N(c.grace)), yrD = (() => { let s = 0; for (let t = 1; t <= 12; t++) s += t <= gr ? A * r : A / n + (A - A / n * (t - gr - 1)) * r; return s; })();
  if (c.sched === "diff") return { pay: A / n + A * r, first: A / n + A * r, grace: A * r, year: yrD, note: "первый платёж самый большой, потом уменьшается" };
  const p = r ? A * r / (1 - Math.pow(1 + r, -n)) : A / n;
  return { pay: p, first: p, grace: A * r, year: p * (12 - gr) + A * r * gr, note: "равными платежами" };
}
// какую сумму можно обслуживать при заданном ежемесячном платеже (те же условия)
function amountForPay(pay, c = X.card) {
  if (!(pay > 0)) return 0;
  const n = Math.max(1, N(c.term) - N(c.grace)), r = N(c.rate) / 100 / 12;
  if (c.product === "Овердрафт" || isWC(c) || c.sched === "end") return r ? pay / r : 0;
  if (c.sched === "diff") return pay / (1 / n + r);
  return r ? pay * (1 - Math.pow(1 + r, -n)) / r : pay * n;
}
const monthsBetween = (iso, ref = new Date()) => { const d = new Date(iso); if (!iso || isNaN(d)) return null; return (ref.getFullYear() - d.getFullYear()) * 12 + ref.getMonth() - d.getMonth(); };

/* ---------------------------------------------------------------- основной расчёт */
function analyze() {
  const c = X.card, P = X.per;
  const withRev = P.filter(p => isNum(fv("rev", p.id)));
  const withBal = P.filter(p => isNum(val("ta", p.id)));
  const pl = withRev[withRev.length - 1] || null, bal = withBal[withBal.length - 1] || null;
  const fulls = withRev.filter(p => N(p.months) === 12);
  const yr = fulls[fulls.length - 1] || null, yr0 = fulls[fulls.length - 2] || null;
  const k = pl ? 12 / (N(pl.months) || 12) : 1;             // перевод в годовое выражение
  const m = { pl, bal, yr, yr0, k };
  if (pl) {
    m.rev = fv("rev", pl.id) * k; m.ni = val("ni", pl.id) * k; m.ebit = val("ebit", pl.id) * k;
    m.da = fv("da", pl.id); m.daKnown = isNum(m.da); m.ebitda = val("ebitda", pl.id) * k;
    m.cit = N(fv("cit", pl.id)) * k; m.int = N(fv("int", pl.id)) * k;
    m.gm = m.rev ? (m.rev - N(fv("cogs", pl.id)) * k) / m.rev : null;
    m.nm = m.rev ? m.ni / m.rev : null;
    m.fam = N(fv("fam", pl.id)) * k;                        // у ИП: деньги, которые уходят на семью
    m.cashYear = m.ebitda - m.cit - m.fam;                 // деньги, которые бизнес зарабатывает за год до платежей по кредитам
    m.cashMonth = m.cashYear / 12;
    m.ocf = fv("ocf", pl.id); if (isNum(m.ocf)) m.ocf *= k;
  }
  if (yr && yr0) { const a = fv("rev", yr0.id), b = fv("rev", yr.id); m.revGr = a ? b / a - 1 : null; }
  if (bal) {
    m.ta = val("ta", bal.id); m.eq = fv("eq", bal.id); m.debt = N(val("debt", bal.id));
    m.ca = val("ca", bal.id); m.cl = val("cl", bal.id);
    m.liq = m.cl ? m.ca / m.cl : null; m.eqr = m.ta ? N(m.eq) / m.ta : null;
  }
  // кредиты
  m.payKnown = isNum(c.payExist) || (c.loans || []).length > 0;
  m.payExist = isNum(c.payExist) ? c.payExist : sum((c.loans || []).filter(l => !l.refin).map(l => l.pay));
  m.newPay = loanPay();
  m.payTotal = m.payExist + (m.newPay ? m.newPay.pay : 0);
  if (isNum(m.cashMonth)) {
    m.dscr = m.payTotal > 0 ? m.cashMonth / m.payTotal : null;
    m.payFree = m.cashMonth / NORM.dscr_ok - m.payExist;    // сколько ещё можно платить в месяц с запасом 25 %
    m.maxAmt = Math.max(0, amountForPay(m.payFree));
  }
  m.debtNew = m.debt + N(c.amount);
  if (isNum(m.ebitda) && m.ebitda > 0) m.lev = m.debtNew / m.ebitda;
  return m;
}

/* ---------------------------------------------------------------- проблемы и расхождения */
function problems(m = analyze()) {
  const c = X.card, out = [];
  const add = (sev, area, title, why, todo) => out.push({ sev, area, title, why, todo });
  const T = v => fmt(v) + " тыс. тг";
  // полнота
  if (!c.name) add("nd", "Карточка", "Не указано наименование клиента", "Без названия заключение будет неполным.", "Заполните «Карточку клиента».");
  if (!N(c.amount) || !N(c.term)) add("nd", "Карточка", "Не указаны сумма или срок кредита", "Без суммы и срока нельзя посчитать будущий платёж и хватит ли на него денег.", "Укажите сумму, срок и ставку в «Карточке клиента».");
  if (!m.pl) add("nd", "Отчётность", "Нет данных о выручке и прибыли (ОПиУ)", "Без отчёта о прибылях и убытках нельзя понять, зарабатывает ли бизнес.", "Загрузите ОПиУ или внесите цифры вручную в «Финансовой отчётности».");
  if (!m.bal) add("nd", "Отчётность", "Нет баланса", "Без баланса не видно долгов, собственных средств и имущества компании.", "Загрузите баланс или внесите цифры вручную.");
  // стоп-факторы
  if (m.bal && isNum(m.eq) && m.eq < 0) add("crit", "Капитал", "Отрицательный собственный капитал", `Долгов у компании больше, чем всего имущества: капитал ${T(m.eq)}. Накопленные убытки «съели» собственные средства.`, "Обычно это стоп-фактор. Уточнить у риск-менеджера, возможно ли финансирование при докапитализации учредителем.");
  // овердрафт: условия продукта
  if (isOD(c)) for (const k of odChecks()) if (k.sev !== "ok") add(k.sev, "Овердрафт", k.t, `Факт: ${k.fact.replace(/\.$/, "")}.`, k.todo);
  if (isBU(c) || isSU(c)) for (const k of prodChecksX(m)) if (k.sev !== "ok") add(k.sev, c.product, k.t, `Факт: ${k.fact.replace(/\.$/, "")}.`, k.todo);
  // платёжеспособность
  if (!isOD(c) && isNum(m.dscr)) {
    if (m.dscr < NORM.dscr_min) add("crit", "Платёжеспособность", "Денег не хватает на платежи по кредитам", `Бизнес зарабатывает ~${T(m.cashMonth)} в месяц, а платить по всем кредитам (вместе с новым) нужно ~${T(m.payTotal)}. Покрытие ${fmt(m.dscr, "x")} — меньше 1.`, m.maxAmt > 0 ? `Снизить сумму до ~${T(Math.floor(m.maxAmt / 100) * 100)} или увеличить срок; проверить, нет ли неучтённых доходов (обороты по счетам).` : "При текущих доходах новый кредит не обслуживается. Проверить обороты по счетам и возможность рефинансирования.");
    else if (m.dscr < NORM.dscr_ok) add("chk", "Платёжеспособность", "Запас по платежам маленький", `Покрытие платежей ${fmt(m.dscr, "x")}: денег хватает впритык, нужно не меньше ${fmt(NORM.dscr_ok, "x")}.`, `Рассмотреть сумму до ~${T(Math.floor(m.maxAmt / 100) * 100)} или больший срок; подтвердить выручку выписками.`);
  } else if (!isOD(c) && m.pl && m.payTotal > 0 && m.cashMonth <= 0) add("crit", "Платёжеспособность", "Бизнес не зарабатывает денег на платежи", "Операционный результат отрицательный — платить по кредитам не из чего.", "Без подтверждённого источника погашения заявку не вести.");
  if (m.pl && !m.daKnown) add("nd", "Отчётность", "Не указана амортизация", "Без неё денежный поток считается по прибыли — это осторожная (заниженная) оценка.", "Если есть ДДС или пояснения к отчётности — внесите амортизацию в ОПиУ.");
  if (isNum(m.lev)) {
    if (m.lev > NORM.lev_max) add("risk", "Долговая нагрузка", "Слишком много долгов относительно заработка", `Все долги с новым кредитом (${T(m.debtNew)}) в ${fmt(m.lev, "1")} раза больше годового заработка (EBITDA ${T(m.ebitda)}). Норма — до ${fmt(NORM.lev_ok, "1")}.`, "Снизить сумму или рассмотреть рефинансирование действующих долгов.");
    else if (m.lev > NORM.lev_ok) add("chk", "Долговая нагрузка", "Долговая нагрузка повышенная", `Долги в ${fmt(m.lev, "1")} раза больше годового заработка (норма до ${fmt(NORM.lev_ok, "1")}).`, "Учесть в заключении; проверить, на что пойдёт кредит и даст ли он рост выручки.");
  } else if (m.pl && m.ebitda <= 0 && (m.debtNew > 0)) add("risk", "Долговая нагрузка", "Заработка нет, а долги есть", "Операционный результат отрицательный, поэтому долги обслуживать не из чего.", "Выяснить причины убытка и источник погашения.");
  // прибыль и выручка
  if (m.pl && m.ni < 0) add("risk", "Прибыль", "Компания работает в убыток", `Чистый убыток ${T(m.ni)} за ${perLabel(m.pl)}${m.k !== 1 ? " (в годовом выражении)" : ""}.`, "Узнать причину (разовые расходы, сезонность, рост затрат) и есть ли улучшение в текущем году.");
  if (isNum(m.revGr)) {
    if (m.revGr <= NORM.rev_drop_risk) add("risk", "Выручка", "Выручка сильно упала", `За ${perLabel(m.yr)} выручка снизилась на ${fmt(-m.revGr, "p")} к ${perLabel(m.yr0)}.`, "Узнать причину; запросить выручку за текущий год (выписки, декларации).");
    else if (m.revGr <= NORM.rev_drop_chk) add("chk", "Выручка", "Выручка снизилась", `Снижение на ${fmt(-m.revGr, "p")} к прошлому году.`, "Уточнить причину у клиента.");
  }
  if (isNum(m.ocf) && m.ocf < 0) add("risk", "Деньги", "Отрицательный денежный поток от основной деятельности", `По ДДС бизнес за год потратил на основную деятельность больше, чем получил: ${T(m.ocf)}. Прибыль «на бумаге» может не превращаться в деньги.`, "Проверить рост дебиторки и запасов; подтвердить поступления выписками.");
  // баланс
  if (isNum(m.liq)) {
    if (m.liq < NORM.liq_min) add("risk", "Ликвидность", "Текущих долгов намного больше, чем быстрых активов", `Коэффициент текущей ликвидности ${fmt(m.liq, "x")}: на 1 тенге долгов до года приходится ${fmt(m.liq, "x")} тенге денег, дебиторки и запасов.`, "Проверить, не придётся ли гасить краткосрочные долги за счёт нового кредита.");
    else if (m.liq < NORM.liq_ok) add("chk", "Ликвидность", "Ликвидность ниже нормы", `Коэффициент ${fmt(m.liq, "x")} (норма от ${fmt(NORM.liq_ok, "x")}).`, "Учесть в заключении.");
  }
  if (isNum(m.eqr) && N(m.eq) >= 0) {
    if (m.eqr < NORM.eq_min) add("risk", "Капитал", "Почти всё имущество куплено на заёмные деньги", `Собственный капитал — только ${fmt(m.eqr, "p")} от активов (норма от ${fmt(NORM.eq_ok, "p")}).`, "Уточнить возможность вложений учредителя.");
    else if (m.eqr < NORM.eq_ok) add("chk", "Капитал", "Мало собственного капитала", `Капитал ${fmt(m.eqr, "p")} от активов (норма от ${fmt(NORM.eq_ok, "p")}).`, "Учесть в заключении.");
  }
  // условия
  if (!isOD(c) && c.purpose === PURPOSES[0] && N(c.term) > NORM.wc_term) add("chk", "Условия", "Длинный срок для пополнения оборотки", `Срок ${c.term} мес.; для оборотных средств обычно не больше ${NORM.wc_term}.`, "Уточнить срок по программе.");
  if (!isOD(c) && m.pl && N(c.amount) && c.purpose === PURPOSES[0] && N(c.amount) > m.rev * NORM.wc_share) add("chk", "Условия", "Сумма велика для оборота компании", `Запрашивают ${T(c.amount)} — это ${fmt(N(c.amount) / m.rev, "p")} годовой выручки.`, "Попросить клиента обосновать потребность (контракты, план закупок).");
  if (c.sched === "end" && !isWC(c) && N(c.amount) && c.product === "Кредит") add("chk", "Условия", "Погашение долга одной суммой в конце", `В конце срока нужно будет вернуть сразу ${T(c.amount)}.`, "Понять, из каких денег будет погашение (контракт, сезон, рефинансирование).");

  /* --- расхождения (сверки) */
  const big = (a, b) => isNum(a) && isNum(b) && Math.abs(a - b) > NORM.diff_abs && Math.abs(a - b) > NORM.diff_pct * Math.max(Math.abs(a), Math.abs(b));
  for (const p of X.per) {
    const ta = val("ta", p.id), tle = val("tle", p.id), L = perLabel(p);
    if (["cash", "ar", "inv", "oca", "fa"].some(k => isNum(fv(k, p.id))) && isNum(ta) && isNum(tle) && Math.abs(ta - tle) > Math.max(5, 0.005 * ta)) add("chk", "Расхождения", `Баланс не сходится (${L})`, `Активы ${T(ta)}, а пассивы ${T(tle)} — разница ${T(ta - tle)}. Скорее всего, ошибка при вводе или загрузке.`, "Сверить строки с документом.");
    const tr = fv("ta_rep", p.id);
    if (isNum(ta) && isNum(tr) && Math.abs(ta - tr) > Math.max(5, 0.005 * tr)) add("chk", "Расхождения", `Итог активов не совпадает с отчётностью (${L})`, `По строкам ${T(ta)}, в документе ${T(tr)}.`, "Проверить, все ли строки баланса заполнены.");
    const ni = val("ni", p.id), nr = fv("ni_rep", p.id);
    if (isNum(ni) && isNum(nr) && Math.abs(ni - nr) > Math.max(5, 0.02 * Math.abs(nr))) add("chk", "Расхождения", `Чистая прибыль не совпадает с отчётностью (${L})`, `По строкам ${T(ni)}, в документе ${T(nr)}.`, "Проверить прочие доходы/расходы и налог.");
  }
  // долг по балансу и взнос по кредитам
  if (m.bal && !m.payKnown && m.debt > NORM.diff_abs) add("chk", "Платёжеспособность", "Не указан взнос по действующим кредитам", `В балансе кредитов и займов на ${T(m.debt)}, а ежемесячный взнос по ним не указан — платёжеспособность получится завышенной.`, "Узнать у клиента примерную сумму платежей в месяц и внести в «Запрашиваемые условия».");
  if (m.bal && m.payKnown && m.payExist === 0 && m.debt > NORM.diff_abs) add("chk", "Расхождения", "Кредиты в балансе есть, а взнос указан нулевой", `В балансе кредитов и займов на ${T(m.debt)}.`, "Уточнить у клиента: возможно, это заём учредителя без графика или кредит уже погашен.");
  if (!X.mgmt && m.pl && m.debt > NORM.diff_abs && !m.int) add("chk", "Расхождения", "Есть кредиты, но нет расходов на проценты", "В балансе есть займы, а в ОПиУ проценты не отражены.", "Уточнить: беспроцентный заём учредителя или ошибка в отчётности.");
  // нераспределённая прибыль vs чистая прибыль
  if (m.yr && m.yr0) {
    const d = N(fv("re", m.yr.id)) - N(fv("re", m.yr0.id)), ni = val("ni", m.yr.id);
    if (isNum(fv("re", m.yr.id)) && isNum(fv("re", m.yr0.id)) && big(d, ni)) add("chk", "Расхождения", "Прибыль не «дошла» до капитала", `Чистая прибыль за ${perLabel(m.yr)} — ${T(ni)}, а нераспределённая прибыль изменилась на ${T(d)}.`, d < ni ? "Возможно, выплачены дивиденды — уточнить сумму (это деньги, ушедшие из бизнеса)." : "Возможны корректировки прошлых лет — уточнить у бухгалтера.");
    // дебиторка растёт быстрее выручки
    const a0 = fv("ar", m.yr0.id), a1 = fv("ar", m.yr.id);
    if (isNum(a0) && isNum(a1) && a0 > 0 && isNum(m.revGr) && a1 / a0 - 1 > m.revGr + 0.3) add("chk", "Расхождения", "Дебиторская задолженность растёт быстрее выручки", `Дебиторка выросла на ${fmt(a1 / a0 - 1, "p")}, а выручка — на ${fmt(m.revGr, "p")}. Покупатели стали дольше платить или часть продаж «на бумаге».`, "Запросить расшифровку дебиторки: крупные должники и сроки.");
  }
  // декларации vs ОПиУ
  for (const s of declYears()) {
    const p = X.per.find(pp => N(pp.months) === 12 && pp.date && pp.date.startsWith(String(s.year)) && isNum(fv("rev", pp.id)));
    if (!p) continue;
    const r = fv("rev", p.id);
    if (isNum(s.rev) && big(r, s.rev)) add("chk", "Расхождения", `Выручка в отчётности не совпадает с декларацией (${s.year})`, `В ОПиУ ${T(r)}, в декларации (${s.forms}) ${T(s.rev)} — разница ${fmt(Math.abs(r / s.rev - 1), "p")}.`, r > s.rev ? "Выручка в отчётности больше, чем показано налоговой — уточнить причину; верить меньшей цифре." : "В декларации доход больше — проверить, полная ли отчётность (может быть другая деятельность).");
    if (isNum(s.vat) && s.vat > 0 && r > s.vat * (1 + NORM.diff_pct) && r - s.vat > NORM.diff_abs) add("chk", "Расхождения", `Оборот по НДС меньше выручки (${s.year})`, `Оборот по декларациям НДС ${T(s.vat)}, выручка ${T(r)}.`, "Проверить, все ли кварталы 300.00 загружены.");
  }
  return out.sort((a, b) => SEVW[b.sev] - SEVW[a.sev]);
}
// декларации по годам (тыс. тг)
function declYears() {
  const by = {};
  for (const d of X.decl || []) {
    if (!d.year) continue;
    const y = by[d.year] = by[d.year] || { year: d.year, rev: null, vat: null, parts: {}, forms: new Set() };
    const v = d.vals || {};
    if (isNum(v.rev) && ["100", "110", "910", "220", "150", "913"].includes(d.form)) { const key = d.form + d.part; if (!y.parts[key]) { y.parts[key] = 1; y.rev = N(y.rev) + v.rev / 1000; y.forms.add(d.form + ".00"); } }
    if (d.form === "300" && (isNum(v.vat_turn) || isNum(v.vat_ex))) { y.vat = N(y.vat) + (N(v.vat_turn) + N(v.vat_ex)) / 1000; }
  }
  return Object.values(by).map(y => ({ ...y, forms: [...y.forms].join(", ") })).sort((a, b) => a.year - b.year);
}

/* ---------------------------------------------------------------- вердикт */
function verdict(probs) {
  const has = s => probs.some(p => p.sev === s), n = s => probs.filter(p => p.sev === s).length;
  const ess = probs.filter(p => p.sev === "nd" && /ОПиУ|баланса|сумма или срок|Поступления за период/.test(p.title));
  if (ess.length) return { sev: "nd", icon: "?", title: "Недостаточно данных для вывода", text: "Заполните недостающее: " + ess.map(p => p.title.toLowerCase()).join("; ") + "." };
  if (has("crit")) return { sev: "crit", icon: "✕", title: "Предварительно не подходит", text: "Есть стоп-фактор(ы). Без их устранения заявку дальше не вести." };
  if (n("risk") >= 2) return { sev: "risk", icon: "!", title: "Сомнительно — нужна доработка", text: "Несколько серьёзных рисков. Возможна заявка на других условиях: меньше сумма, больше срок, дополнительное обеспечение." };
  if (has("risk")) return { sev: "chk", icon: "!", title: "Подходит с условиями", text: "Есть один серьёзный риск — его нужно закрыть до подачи заявки." };
  if (has("chk")) return { sev: "chk", icon: "✓", title: "Предварительно подходит, нужны уточнения", text: "Критичных проблем нет, но есть вопросы, которые надо прояснить с клиентом." };
  return { sev: "ok", icon: "✓", title: "Предварительно подходит", text: "Критичных проблем и расхождений не найдено. Можно собирать полный пакет документов." };
}

/* ================================================================ Овердрафт (сокращённо, по правилам основного сайта):
   лимит = 40 % среднемесячных очищенных кредитовых оборотов за 6 (при сезонности 12) полных месяцев до месяца заявки —
   отдельно по оборотам в нашем банке и в других банках (не более 2); при транше до 90 дней — не более 100 млн тг;
   доля одного покупателя больше 60 % — его поступления берутся не более 60 %. */
const OD_CAP = 100000;   // тыс. тг
const isOD = (c = X.card) => c.product === "Овердрафт";
function odCfg(c = X.card) { c.od = Object.assign({ tranche: 30, seasonal: "Нет", appMonth: "", exp: null, buyers: null, topShare: null, otherBanks: null, banned: "Нет", m: {}, st: [], stWhere: "our" }, c.od || {}); c.od.m = c.od.m || {}; c.od.st = c.od.st || []; return c.od; }
const ymNow = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
const MON = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
const ymLabel = ym => { const [y, m] = ym.split("-"); return `${MON[+m - 1]} ${y}`; };
function odWindow(o = odCfg()) {
  const [y, m] = (o.appMonth || ymNow()).split("-").map(Number), n = o.seasonal === "Да" ? 12 : 6, out = [];
  for (let i = n; i >= 1; i--) { const d = new Date(y, m - 1 - i, 1); out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`); }
  return out;
}
function odCalc() {
  const o = odCfg(), win = odWindow(o), n = win.length, S = odStatements(o, win);
  // по каждой группе: если есть выписки — суммы из выписок, иначе — внесённые вручную
  const val = (ym, w) => S[w].has ? (S[w].months[ym].covered ? S[w].months[ym].net : null) : (o.m[ym]?.[w] ?? null);
  const rows = win.map(ym => ({ ym, our: val(ym, "our"), other: val(ym, "other"), nOps: S.our.has || S.other.has ? N(S.our.months[ym].n) + N(S.other.months[ym].n) : null }));
  const filled = rows.filter(r => isNum(r.our) || isNum(r.other)).length;
  const sOur = sum(rows.map(r => r.our)), sOther = sum(rows.map(r => r.other));
  // покупатели: по выпискам — сами; иначе — со слов клиента
  const auto = S.our.has || S.other.has;
  const allCp = new Map(); for (const w of ["our", "other"]) for (const [k, x] of S[w].cps) { const y = allCp.get(k) || { name: x.name, v: 0 }; y.v += x.v; allCp.set(k, y); }
  const cpl = [...allCp.values()].sort((a, b) => b.v - a.v), cpTot = sum(cpl.map(x => x.v));
  const buyers = auto ? cpl.length : o.buyers, topShare = auto ? (cpTot ? cpl[0].v / cpTot * 100 : null) : o.topShare;
  const otherBanks = S.other.has ? S.other.banks.size : o.otherBanks;
  const share = isNum(topShare) ? topShare / 100 : 0, adj = share > 0.6 ? 1 - 0.4 * share : 1;
  const grpAvg = (w, s) => S[w].has ? Math.max(0, s - S[w].cut) / n : s * adj / n;
  const avgOur = grpAvg("our", sOur), avgOther = N(otherBanks) > 2 ? 0 : grpAvg("other", sOther);
  const limOur = 0.4 * avgOur, limOther = 0.4 * avgOther, lim = limOur + limOther;

/* ================================================================ Овердрафт: выписки по счетам → очищенные кредитовые обороты.

/* загрузка выписки: PDF (текст или скан) или Excel → только поступления, в тенге как в документе */
async function odImportStmt(file, where, onProg) {
  if (!/\.(pdf|xlsx|xlsm|xls)$/i.test(file.name)) return { err: "нужна выписка в PDF или Excel" };
  let r;
  try {
    const buf = await file.arrayBuffer();
    if (/\.pdf$/i.test(file.name)) { let pdf = await PdfReader.read(buf); if (pdf.noText) pdf = await OCR.pdf(buf, onProg); r = DocParse.readLines(pdf); r.ocr = pdf.ocr; }
    else r = DocParse.readSheets(await readWorkbook(buf));
  } catch (e) { return { err: "не удалось прочитать: " + e.message }; }
  if (r.kind === "bank") return { err: "это справка об оборотах — в ней нет отдельных операций, исключения посчитать нельзя. Нужна выписка по счёту" };
  if (r.kind !== "stmt" || !r.stmt || !r.stmt.txs.length) return { err: "не похоже на выписку по счёту: не найдена таблица операций (дата, сумма, назначение)" };
  const st = r.stmt, txs = st.txs.filter(t => t.cr > 0).map(t => ({ d: t.d, doc: t.doc || "", cp: t.cp || "", bin: t.bin || "", knp: t.knp || "", purp: (t.purp || "").slice(0, 300), op: (t.op || "").slice(0, 80), cr: t.cr, eq: isNum(t.eq) ? t.eq : null }))
    .sort((a, b) => a.d.localeCompare(b.d));
  if (!txs.length) return { err: "в выписке нет поступлений" };
  const o = odCfg();
  // та же выписка повторно — заменяем
  o.st = o.st.filter(x => !(x.acc && x.acc === st.acc && x.from === st.from && x.to === st.to));
  o.st.push({ id: uid(), file: file.name, bank: st.bank, acc: st.acc, cur: st.cur || "KZT", rate: null, where, from: st.from, to: st.to || "", bin: st.bin, txs });
  return { ok: true, txt: `${st.bank || "банк не определён"}${st.acc ? ", счёт " + st.acc : ""}${st.from ? `, ${st.from}–${st.to}` : ""}: поступлений ${txs.length}${st.cur && st.cur !== "KZT" ? `; валюта ${st.cur} — укажите курс` : ""}.${r.ocr ? " Распознано со скана — проверьте операции." : ""}` };
}

/* ---------------------------------------------------------------- отрицательные значения — красным (таблицы, поля, плашки, текст) */
const NEG_RE = /[−-]\s?\d[\d\u00a0\u202f ]*(?:,\d+)?(?:\s?%)?/g;
const NEG_SKIP = ".verdict, .dverdict, .odres > div:first-child, .maxsum > div:last-child, .tabbar, .rail, script, style, textarea, select, option, .tag";
function markNeg(root = document.body) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement && !n.parentElement.closest(NEG_SKIP + ", .negv") && /[−-]\s?\d/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT) });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const t = n.nodeValue; NEG_RE.lastIndex = 0; let m, last = 0; const frag = document.createDocumentFragment();
    while ((m = NEG_RE.exec(t))) {
      // «1 − 2» (знак между числами) и даты/телефоны — не отрицательные
      const before = t.slice(0, m.index); if (/[\d)]\s*$/.test(before) && !/\(\s*$/.test(before)) continue;
      frag.append(t.slice(last, m.index)); const sp = document.createElement("span"); sp.className = "negv"; sp.textContent = m[0]; frag.append(sp); last = m.index + m[0].length;
    }
    if (!last) continue; frag.append(t.slice(last)); n.replaceWith(frag);
  }
  for (const el of root.querySelectorAll("input.num")) negInput(el);
}
const negInput = el => el.classList.toggle("negin", /^\s*[−-]\s?\d|^\(\s*\d/.test(el.value));

function odExTable(d) {

  const catOpts = [["inc", "учитывается"], ...Object.entries(OD_EX)];
  return `<h3 style="margin:18px 0 8px">Что исключено из поступлений</h3>
    <div class="tw"><table class="t odex"><thead><tr><th class="l">Вид поступления (по методике)</th><th>Операций</th><th>Сумма, тыс. тг</th></tr></thead><tbody>${rows}
